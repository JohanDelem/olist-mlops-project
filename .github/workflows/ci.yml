name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip setuptools
          pip install -e .
          pip install ruff black bandit pytest pytest-cov
          pip install pandas numpy scikit-learn joblib
          pip install fastapi uvicorn httpx pydantic
          pip install mlflow boto3 python-dotenv

      - name: Ruff lint
        run: ruff check src/ tests/

      - name: Black format check
        run: black --check src/ tests/

      - name: Bandit security scan
        run: bandit -c pyproject.toml -r src/

      - name: Tests
        run: pytest tests/test_data.py tests/test_features.py tests/test_predict.py -v

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f backend/Dockerfile -t olist-backend:latest .
